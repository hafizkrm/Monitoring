root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./bin/nms-agent"
  cmd = "go build -o ./bin/nms-agent ./cmd/agent"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "deployments"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_suffix = []
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  include_file = []
  kill_delay = "0s"
  log = ""
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app_output = ""
  build_log_main = "magenta"
  build_log_time = ""
  main_output = ""
  time = "green"

[log]
  main_simple = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
