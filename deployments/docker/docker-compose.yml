version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: nms-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-nms_db}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  agent:
    build: 
      context: ../../backend
      dockerfile: ../deployments/docker/Dockerfile
    container_name: nms-agent
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_HOST=db
      - DATABASE_USER=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_NAME=${DB_NAME:-nms_db}
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./var/log:/app/var/log
      - ../../frontend:/app/frontend
    ports:
      - "8080:8080"

volumes:
  mysql_data:

